name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        working-directory: ticket-manager-back
        run: pip install -r requirements.txt

      - name: Rodar testes
        working-directory: ticket-manager-back
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ticket-manager-front/package-lock.json

      - name: Instalar dependências
        working-directory: ticket-manager-front
        run: npm ci

      - name: Checar tipos e build
        working-directory: ticket-manager-front
        run: npm run build

      - name: Rodar testes
        working-directory: ticket-manager-front
        run: npm run test -- --run
